# CI do painel. Backend e front são jobs independentes, em paralelo.
#
# Quando roda:
# - push e pull request: só o job cuja pasta mudou (mexeu só no frontend/,
#   roda só o front); mudança só em arquivos .md não dispara nada;
# - à mão, pela aba Actions ("Run workflow"): tudo.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

jobs:
  # Descobre quais pastas mudaram. Mudança no próprio workflow conta para os dois.
  mudancas:
    name: Pastas alteradas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            backend: ["backend/**", ".github/workflows/**"]
            frontend: ["frontend/**", ".github/workflows/**"]

  backend:
    name: Backend (Java 21 + Spring Boot)
    needs: mudancas
    if: ${{ github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # O runner do GitHub já tem Docker: o Testcontainers sobe um
      # PostgreSQL descartável para os testes de banco, como na máquina local.
      # A chave-mestra dos segredos é criada na hora (~/.qapanel), só para o CI.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-relatorios-de-teste
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Front (React + TypeScript)
    needs: mudancas
    if: ${{ github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build = checagem de tipos (tsc -b) + versão de produção (vite build)
      - run: npm run build
