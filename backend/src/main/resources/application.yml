# Configuração da aplicação.
# O Spring lê este arquivo na inicialização e injeta os valores nas
# classes anotadas com @ConfigurationProperties (ver PainelProperties).
spring:
  application:
    name: painel-backend

  # Conexão com o PostgreSQL do compose.yaml. Ao rodar pelo Maven, o
  # spring-boot-docker-compose sobe o container e preenche isto sozinho;
  # os valores abaixo valem quando o banco é iniciado por fora.
  datasource:
    url: jdbc:postgresql://localhost:5432/qapanel
    username: qapanel
    password: qapanel

  docker:
    compose:
      file: compose.yaml
      # Sobe o banco se precisar, mas não derruba ao parar a aplicação.
      lifecycle-management: start-only

  jpa:
    # Quem cria/altera tabelas é o Flyway. O Hibernate só VALIDA que as
    # entidades Java batem com as tabelas — e recusa subir se não baterem.
    hibernate:
      ddl-auto: validate
    # Desliga o "open session in view": o acesso ao banco fica restrito à
    # camada de serviço, e não vaza para a renderização da resposta.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  port: 8080

# Actuator: endpoints de operação. /actuator/health diz se a aplicação
# está de pé — é o que um orquestrador (Docker, Kubernetes) consulta.
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Projetos de teste que o painel conhece. Os diretórios são relativos à
# pasta de onde o backend é executado (painel-pro/backend) e podem ser
# sobrescritos por variável de ambiente, ex.: PAINEL_PROJETOS_0_DIRETORIO.
painel:
  projetos:
    - id: cypress
      nome: Cypress
      tipo: CYPRESS
      diretorio: ../../serverest-qa/cypress
      pasta-specs: cypress/e2e
      padrao-spec: '.*\.cy\.[jt]sx?$'
      navegadores: [electron, chrome, edge, firefox]
      arquivo-regras: ../../serverest-qa/REGRAS_DE_NEGOCIO.md
      codigo-sistema: [../../_arquivo/ServeRest-front, ../../_arquivo/ServeRest]
    - id: playwright
      nome: Playwright
      tipo: PLAYWRIGHT
      diretorio: ../../serverest-qa/playwright
      pasta-specs: tests
      padrao-spec: '.*\.(spec|test)\.[jt]sx?$'
      navegadores: [chromium, chrome, msedge, firefox, webkit]
      arquivo-regras: ../../serverest-qa/REGRAS_DE_NEGOCIO.md
      codigo-sistema: [../../_arquivo/ServeRest-front, ../../_arquivo/ServeRest]
    - id: k6
      nome: k6 (desempenho)
      tipo: K6
      diretorio: ../../serverest-qa/k6
      pasta-specs: tests
      padrao-spec: '.*\.js$'
      navegadores: []
      arquivo-regras: ../../serverest-qa/REGRAS_DE_NEGOCIO.md
      codigo-sistema: [../../_arquivo/ServeRest-front, ../../_arquivo/ServeRest]
